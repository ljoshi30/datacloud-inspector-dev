# Cloudflare Worker config — Data 360 Inspector USAGE REPORT (reads Firestore).
# The Worker no longer uses D1; it reads the Firestore `usage` collection with a
# Firebase service-account key and serves a password-gated report.
name = "d360-usage"
main = "worker.js"
compatibility_date = "2025-01-01"

# No d1_databases binding anymore. SECRETS instead (not stored here):
#   wrangler secret put FIREBASE_SA     ← paste the whole service-account JSON (Firebase console →
#                                          Project settings → Service accounts → Generate new private key)
#   wrangler secret put REPORT_TOKEN    ← ADMIN password (sees Public + Dev/internal)
#   wrangler secret put MANAGER_TOKEN   ← MANAGER password (sees ONLY the Public bookmarklet section)
#   wrangler secret put DEV_TOKEN       ← DEV password, optional (sees ONLY the Dev/internal section)
# Then open:  https://<your-worker-url>/   → sign-in page (auth rides an HttpOnly cookie; no token in the URL).
